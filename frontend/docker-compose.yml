services:
  # ─── BACKEND ───
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: alkher-server-dev
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: development
      PORT: 4000
      BASE_URL: http://localhost:4000
      CLIENT_URL: http://localhost:5173
      JWT_SECRET: dev_jwt_secret_change_me
      JWT_EXPIRES_IN: 7d
      CERT_SECRET: dev_cert_secret_change_me
      DB_PATH: /app/data/alkher.db
      SMTP_HOST: ""
      SMTP_PORT: 587
      SMTP_USER: ""
      SMTP_PASS: ""
      SMTP_FROM: "ALKHER ACADEMY <no-reply@alkher-academy.com>"
      ALKHERPAY_API_KEY: ""
      ALKHERPAY_WEBHOOK_SECRET: ""
      UPLOAD_DIR: /app/uploads
      MAX_UPLOAD_MB: 5
      SEED_ADMIN_EMAIL: admin@alkher.com
      SEED_ADMIN_PASSWORD: Admin@2026
    volumes:
      - ./server/src:/app/src
      - ./server/uploads:/app/uploads
      - alkher-db-dev:/app/data
    networks:
      - alkher-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ─── FRONTEND ───
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: alkher-client-dev
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:4000/api
      VITE_SOCKET_URL: http://localhost:4000
    volumes:
      - ./client/src:/app/src
      - ./client/public:/app/public
      - ./client/index.html:/app/index.html
      - ./client/vite.config.js:/app/vite.config.js
    depends_on:
      - server
    networks:
      - alkher-net

networks:
  alkher-net:
    driver: bridge

volumes:
  alkher-db-dev:
    driver: local