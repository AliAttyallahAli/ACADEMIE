services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile.prod
    container_name: alkher-server
    restart: unless-stopped
    env_file:
      - .env.prod
    ports:
      - "4000:4000"
    volumes:
      - alkher-uploads:/app/uploads
      - alkher-db:/app/data
    networks:
      - alkher-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512M

  client:
    build:
      context: ./client
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_SOCKET_URL: ${VITE_SOCKET_URL}
    container_name: alkher-client
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - server
    networks:
      - alkher-net
    deploy:
      resources:
        limits:
          memory: 128M

networks:
  alkher-net:
    driver: bridge

volumes:
  alkher-uploads:
    driver: local
  alkher-db:
    driver: local